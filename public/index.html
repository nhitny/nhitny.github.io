<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0b14" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" />
  <title>Yến Nhi | AI Engineer</title>
  <meta name="description" content="Yến Nhi (nhitny) — AI Engineer working on NLP, RAG and Large Language Models. Master's student in Computer Science at UIT – VNUHCM.">

  <!-- Open Graph / social previews -->
  <meta property="og:url" content="https://nhitny.github.io/">

  <meta property="og:title" content="Yến Nhi | AI Engineer">
  <meta property="og:description" content="AI Engineer working on NLP, RAG and Large Language Models.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Yến Nhi | AI Engineer">
  <meta name="twitter:description" content="AI Engineer working on NLP, RAG and Large Language Models.">

  <!-- apply saved theme before first paint (default: dark) -->
  <script>
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
      if (t === "dark") document.documentElement.classList.add("dark");
    })();
  </script>

  <style>
    /* ---------- intro loader (removed by React once the app is ready) ---------- */
    #st-loader {
      --l-bg: #fbf7f4; --l-ink: #2b2238; --l-muted: #6f6680;
      --l-a: #8b5cf6; --l-b: #e7779f;
      --l-blob1: rgba(196, 181, 253, .6); --l-blob2: rgba(249, 168, 201, .5);
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: var(--l-bg); overflow: hidden;
      transition: opacity .6s ease, visibility .6s ease;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    html.dark #st-loader {
      --l-bg: #0d0b14; --l-ink: #f5f1fb; --l-muted: #a8a0bb;
      --l-a: #b8a4ff; --l-b: #ff9fc6;
      --l-blob1: rgba(140, 100, 255, .45); --l-blob2: rgba(255, 110, 170, .3);
    }
    #st-loader.is-done { opacity: 0; visibility: hidden; }

    .stl-stage { position: relative; width: 200px; height: 200px; }
    .stl-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px dashed color-mix(in srgb, var(--l-a) 55%, transparent);
      animation: stl-spin 14s linear infinite;
    }
    .stl-ring::after {
      content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px;
      margin-left: -5px; border-radius: 50%; background: var(--l-b);
      box-shadow: 0 0 14px var(--l-b);
    }
    .stl-blob {
      position: absolute; inset: 16px;
      background: linear-gradient(140deg, var(--l-blob1), var(--l-blob2));
      border-radius: 58% 42% 55% 45% / 48% 58% 42% 52%;
      animation: stl-morph 5s ease-in-out infinite;
    }
    .stl-chibi {
      position: absolute; left: 50%; bottom: 6px; width: 130px; height: auto;
      transform: translateX(-50%);
      animation: stl-bob 1.6s ease-in-out infinite;
      filter: drop-shadow(0 12px 18px rgba(43, 34, 56, .25));
    }
    .stl-zz {
      position: absolute; right: 2px; top: 18px; font-size: 18px; color: var(--l-b);
      animation: stl-twinkle 1.8s ease-in-out infinite;
    }
    .stl-name {
      font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 600;
      font-size: 30px; color: var(--l-ink); letter-spacing: -.01em;
    }
    .stl-name span {
      background: linear-gradient(100deg, var(--l-a), var(--l-b));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .stl-status { font-size: 12px; color: var(--l-muted); height: 16px; }
    .stl-status b { color: var(--l-a); font-weight: 500; }
    .stl-bar {
      width: 180px; height: 3px; border-radius: 3px; overflow: hidden;
      background: color-mix(in srgb, var(--l-muted) 20%, transparent);
    }
    .stl-bar i {
      display: block; height: 100%; width: 0; border-radius: 3px;
      background: linear-gradient(90deg, var(--l-a), var(--l-b));
      animation: stl-fill 1.5s cubic-bezier(.3, .8, .4, 1) forwards;
    }
    #st-loader.is-done .stl-bar i { width: 100%; animation: none; transition: width .3s ease; }

    /* sakura petals */
    .stl-petal {
      position: absolute; top: -30px; width: 14px; height: 10px;
      background: linear-gradient(135deg, #ffd1e3, #ff9fc6);
      border-radius: 150% 0 150% 0; opacity: .85;
      animation: stl-fall linear infinite, stl-sway ease-in-out infinite alternate;
    }
    html.dark .stl-petal { opacity: .6; }

    @keyframes stl-spin { to { transform: rotate(360deg); } }
    @keyframes stl-morph {
      0%, 100% { border-radius: 58% 42% 55% 45% / 48% 58% 42% 52%; }
      50% { border-radius: 42% 58% 45% 55% / 58% 44% 56% 42%; }
    }
    @keyframes stl-bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }
    @keyframes stl-twinkle { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(.7) rotate(30deg); opacity: .5; } }
    @keyframes stl-fill { 0% { width: 0; } 100% { width: 88%; } }
    @keyframes stl-fall { to { top: 110%; } }
    @keyframes stl-sway { from { transform: translateX(-20px) rotate(0deg); } to { transform: translateX(30px) rotate(220deg); } }

    @media (prefers-reduced-motion: reduce) {
      #st-loader * { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
      .stl-petal { display: none; }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <div id="st-loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="stl-stage">
      <div class="stl-ring"></div>
      <div class="stl-blob"></div>
      <img class="stl-chibi" src="%PUBLIC_URL%/chibi-loader.webp" alt="" width="130" height="201" />
      <span class="stl-zz">✦</span>
    </div>
    <div class="stl-name">Yến <span>Nhi</span></div>
    <div class="stl-status">&gt; <b id="stl-step">tokenizing</b>…</div>
    <div class="stl-bar"><i></i></div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("st-loader");
      // petals
      for (var i = 0; i < 14; i++) {
        var p = document.createElement("span");
        p.className = "stl-petal";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (5 + Math.random() * 5) + "s, " + (2 + Math.random() * 2) + "s";
        p.style.animationDelay = (-Math.random() * 8) + "s, 0s";
        var s = 0.6 + Math.random() * 0.8;
        p.style.width = 14 * s + "px";
        p.style.height = 10 * s + "px";
        root.appendChild(p);
      }
      // status text
      var steps = ["tokenizing", "embedding", "attending", "generating"];
      var el = document.getElementById("stl-step"), k = 0;
      window.__stlTimer = setInterval(function () {
        k = (k + 1) % steps.length;
        el.textContent = steps[k];
      }, 380);
    })();
  </script>

  <div id="root"></div>
</body>

</html>
